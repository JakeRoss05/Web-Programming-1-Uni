<!DOCTYPE html>
<html>
    <head> <!--The head is for content that need to load first and quickly, nothing to do with layour or the header and content within it (with expections like the title) wont be seen-->
        <meta name="author" content="Jake C Ross">
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!--Viewport is just to do with sizing and zoom of the page and the browser looks specifically for "viewport" for instructions on how it should be done. Whats happening here is we are making the width equal the device width and initial scale 1 is setting the page zoom to 100-->
        <title>Norwich Yoga Studio</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> <!--This is the stylesheet that contains what we need for the hamburger and does not overwrite or effect our style.css or anything-->
    </head>
    <body>
        <div id="wrapper"> <!--Remember that ids can only be used once and classes can be reused as many times as you want-->
            <header>
                <h1>Norwich Yoga Studio</h1>
                <a><i class="fa fa-bars" id="hamburger"></i></a>
            </header>
            <nav>
                <ul class="navlist">
                    <li><a href="index.html" class="active">Home</a></li>                       <!--Notice too how if somthing is inside of a tag in my code, I will always put it indented forward under what its inside. Keep the indentation like that for readability and avoiding issus of putting the wrong content in a tag-->
                    <li><a href="Classes.html">Classes</a></li>
                    <li><a href="Schedule.html">Schedule</a></li>
                    <li><a href="Contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
        <main>
            <h3>Contact Norwich Yoga Studio</h3>
            <section>
                <form id="contactform">
                    <fieldset id="contactfieldset">
                        <legend id="contactlegend">Contact Form</legend>
                        <label for="name">First Name</label>
                        <input type="text" id="name" name="name"><br></br>
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email"><br></br>
                        <label for="message">Send Message</label>
                        <textarea id="message" name="message">Type Here...</textarea>
                        <input id="submitbutton" type="submit" value="Send Message">
                        <p class="confirmMessage">*Required Field</p>
                    </fieldset>
                </form>
            </section> 
        </main>
        <footer>
            <h1>Copyright © 2026 Norwich Yoga Studio</h1>
        </footer>
    </body>
</html>
